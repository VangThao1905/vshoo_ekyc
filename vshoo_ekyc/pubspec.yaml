name: vshoo_ekyc
description: "A new Flutter plugin project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.5.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  freezed_annotation: ^2.1.0
  json_annotation: ^4.6.0
  fpdart: ^1.1.0
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  dio: ^5.7.0
  image: ^4.2.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.2.0
  json_serializable: ^6.5.4
  build_runner: ^2.3.0
  injectable_generator: ^2.6.2

flutter:
  plugin:
    platforms:
      android:
        package: com.vshoo.vshoo_ekyc
        pluginClass: VshooEkycPlugin
      ios:
        pluginClass: VshooEkycPlugin

